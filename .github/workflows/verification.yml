name: Verification & Quality Checks

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick Check Job (runs first, fast feedback)
  quick-check:
    name: Quick Check (TypeScript + ESLint + Smoke Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quick verification
        run: npm run verify:quick

      - name: Upload quick check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-check-results
          path: .verification/reports/
          retention-days: 7

  # UI Testing Job (Playwright E2E tests)
  ui-tests:
    name: UI Tests (Playwright E2E)
    runs-on: ubuntu-latest
    needs: quick-check
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .verification/agents/ui-tester/reports/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: .verification/test-results/
          retention-days: 7

  # Code Review Job (ESLint + Accessibility)
  code-review:
    name: Code Review (ESLint + Accessibility + Safety)
    runs-on: ubuntu-latest
    needs: quick-check
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (Full)
        run: npm run lint:full
        continue-on-error: true

      - name: Run Accessibility Checks
        run: npm run lint:a11y || echo "Accessibility warnings found"

      - name: Upload ESLint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-results
          path: .verification/agents/code-reviewer/reports/
          retention-days: 7

  # Performance Check Job (Lighthouse + Bundle Analysis)
  performance-check:
    name: Performance Check (Lighthouse + Bundle)
    runs-on: ubuntu-latest
    needs: quick-check
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Analyze bundle size
        run: npm run perf:analyze || echo "Bundle analysis script not found"
        continue-on-error: true

      - name: Run Lighthouse CI
        run: npm run perf:check || echo "Lighthouse check script not found"
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: |
            .verification/agents/performance-checker/reports/
            dist/
          retention-days: 7

  # Full Verification Summary
  verification-summary:
    name: Verification Summary
    runs-on: ubuntu-latest
    needs: [quick-check, ui-tests, code-review, performance-check]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .verification/reports/

      - name: Generate verification summary
        run: npm run verify:report || echo "Summary generation skipped"

      - name: Upload final summary
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary
          path: .verification/reports/latest/
          retention-days: 30

      - name: Check verification status
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 VERIFICATION SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Quick Check:      ${{ needs.quick-check.result }}"
          echo "UI Tests:         ${{ needs.ui-tests.result }}"
          echo "Code Review:      ${{ needs.code-review.result }}"
          echo "Performance:      ${{ needs.performance-check.result }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "${{ needs.quick-check.result }}" = "failure" ] || \
             [ "${{ needs.ui-tests.result }}" = "failure" ] || \
             [ "${{ needs.code-review.result }}" = "failure" ]; then
            echo "❌ CRITICAL CHECKS FAILED - Review required"
            exit 1
          elif [ "${{ needs.performance-check.result }}" = "failure" ]; then
            echo "⚠️  Performance checks failed - Review recommended"
            exit 0
          else
            echo "✅ ALL CHECKS PASSED"
            exit 0
          fi

  # PR Comment with Results (optional, requires permissions)
  pr-comment:
    name: Post PR Comment
    runs-on: ubuntu-latest
    needs: verification-summary
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Download verification summary
        uses: actions/download-artifact@v4
        with:
          name: verification-summary
          path: ./summary/

      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = `## 🤖 Verification Results\n\n`;
            comment += `| Check | Status |\n`;
            comment += `|-------|--------|\n`;
            comment += `| Quick Check | ${{ needs.quick-check.result == 'success' ? '✅ Passed' : '❌ Failed' }} |\n`;
            comment += `| UI Tests | ${{ needs.ui-tests.result == 'success' ? '✅ Passed' : '❌ Failed' }} |\n`;
            comment += `| Code Review | ${{ needs.code-review.result == 'success' ? '✅ Passed' : '❌ Failed' }} |\n`;
            comment += `| Performance | ${{ needs.performance-check.result == 'success' ? '✅ Passed' : '⚠️ Warning' }} |\n`;
            comment += `\n---\n`;
            comment += `📊 [View detailed reports in Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
